<!DOCTYPE html>
<html>
<head>
  <title>內湖 Sales</title>
  <meta charset="utf-8">
  <style>
    body,html,#map{height:100%;margin:0;padding:0;font-family:sans-serif;}
    .overlay{position:absolute;bottom:20px;left:20px;background:white;padding:15px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.3);z-index:5;}
    .legend-item{display:flex;align-items:center;margin-bottom:5px;}
    .cbox{width:20px;height:20px;margin-right:10px;border-radius:50%;border:1px solid #ccc;}
    .note{font-size:12px;color:#666;margin-top:10px;border-top:1px solid #eee;padding-top:10px;}
  </style>
  <script>
    const geojsonData = {{GEOJSON_DATA}};
    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {zoom: 14, center: { lat: 25.079, lng: 121.583 }});
      const infoW = new google.maps.InfoWindow();

      geojsonData.features.forEach(f => {
        const p = f.properties, c = f.geometry.coordinates;
        let col = "gray", z = 1;
        if (p.含車位) { col = "gray"; z = 0; }
        else {
          const pr = p.每坪單價萬元;
          if (pr < 40) col = "lightblue";
          else if (pr < 60) col = "green";
          else if (pr < 80) col = "yellow";
          else if (pr < 100) col = "orange";
          else col = "red";
        }
        const icon = {path: google.maps.SymbolPath.CIRCLE, fillColor: col, fillOpacity: 0.9, strokeWeight: 1, scale: 8};
        const marker = new google.maps.Marker({position: new google.maps.LatLng(c[1], c[0]), map: map, icon: icon, title: p.地址, zIndex: z});
        marker.addListener("click", () => {
          infoW.setContent(`
            <div style="font-family:sans-serif;">
              <h3 style="margin:0 0 5px;">${p.地址}</h3>
              <p style="margin:2px 0;"><strong>建物型態:</strong> ${p.建物型態}</p>
              <p style="margin:2px 0;"><strong>每坪單價:</strong> ${p.每坪單價萬元} 萬元/坪</p>
              <p style="margin:2px 0;"><strong>交易日期:</strong> ${p.交易日期}</p>
              ${p.含車位 ? '<p style="margin:2px 0;color:#666;">(含車位)</p>' : ''}
            </div>`);
          infoW.open(map, marker);
        });
      });
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key={{MAPS_KEY}}&callback=initMap&loading=async" async defer></script>
</head>
<body>
  <div id="map"></div>
  <div class="overlay">
    <h3 style="margin-top:0;">內湖區 Sales Data</h3>
    <div><strong>Median Price:</strong> {{MEDIAN_PRICE}} 萬元/坪 (Excl. Park)</div>
    <div style="margin-top:10px;">
      <div class="legend-item"><div class="cbox" style="background:lightblue;"></div>&lt; 40 萬元/坪</div>
      <div class="legend-item"><div class="cbox" style="background:green;"></div>40 - 60 萬元/坪</div>
      <div class="legend-item"><div class="cbox" style="background:yellow;"></div>60 - 80 萬元/坪</div>
      <div class="legend-item"><div class="cbox" style="background:orange;"></div>80 - 100 萬元/坪</div>
      <div class="legend-item"><div class="cbox" style="background:red;"></div>&ge; 100 萬元/坪</div>
      <div class="legend-item"><div class="cbox" style="background:gray;"></div>含車位 (Exc. Med)</div>
    </div>
    <div class="note">* Positions approximate.<br>* ONE WEEK of data (~34 points).</div>
  </div>
</body>
</html>
